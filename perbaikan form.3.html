<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengenal Form Lebih Lanjut</title>
</head>
<body>
<form action="form3.html" method="get">
    <!-- PERBAIKAN: label terhubung ke select -->
    <label for="matkul">Pilih Mata kuliah:</label>
    <select name="matkul" id="matkul" required>
        <!-- PERBAIKAN: opsi petunjuk (value kosong, tidak bisa dikirim) -->
        <option value="" selected disabled>-- Pilih mata kuliah --</option>
        <option value="web1">Pemrograman Web Native</option>
        <option value="web2">Pemrograman Web Framework</option>
        <option value="mobile1">Pemrograman Mobile Native</option>
        <option value="mobile2">Pemrograman Mobile Lintas Platform</option>
    </select><!-- PERBAIKAN: penutup select ditambahkan -->
    <p><button type="submit">Kirim</button></p>
</form>
</body>
</html>
