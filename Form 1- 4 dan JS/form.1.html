<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mengenal Form</title>
    <body>
    <form action="form.1.html" method="post">
        <p>Silahkan isi data berikut :</p>
        Nama : <input type="text" name="nama"> <br />
        Jenis Kelamin :
        <input type="radio" name="jenkei" value="laki-laki">laki-laki
        <input type="radio" name="jenkei" value="perempuan">perempuan <br/>
        Username : <input type="text" name="username"> <br />
        Password : <input type="password" name="password"> <br />

        <input type="checkbox" name="javascript">javascript

        <input type="checkbox" name="node">Node JS
        <br/><br/>
        <button type="submit" name="submit" value="simpan">Simpan</button>
    </form>
    </body>
    </html>
